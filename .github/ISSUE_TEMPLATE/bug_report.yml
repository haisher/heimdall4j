name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: Heimdall4j version
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "25"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - heimdall4j-circuitbreaker
        - heimdall4j-retry
        - heimdall4j-ratelimiter
        - heimdall4j-timeout
        - heimdall4j-resilience
        - heimdall4j-spring-boot
        - heimdall4j-sidecar
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code or config to reproduce the issue
      render: java
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace (if applicable)
      render: shell
