name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Heimdall4j? Describe it below.

  - type: dropdown
    id: module
    attributes:
      label: Related module (if any)
      options:
        - heimdall4j-circuitbreaker
        - heimdall4j-retry
        - heimdall4j-ratelimiter
        - heimdall4j-timeout
        - heimdall4j-resilience
        - heimdall4j-spring-boot
        - heimdall4j-sidecar
        - New module
        - Not sure

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you envision this working?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you've considered?
