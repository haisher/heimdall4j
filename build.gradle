plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'org.jreleaser' version '1.24.0'
}

allprojects {
    group = 'io.github.haisher'
    version = '0.1.4-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Javadoc).configureEach {
        options.memberLevel = JavadocMemberLevel.PUBLIC
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport

        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
            showExceptions = true
            showCauses = true
            showStackTraces = true
            exceptionFormat = 'full'
        }
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/haisher/heimdall4j")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
            maven {
                name = "StagingDeploy"
                url = layout.buildDirectory.dir("staging-deploy")
            }
        }

        publications {
            maven(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = 'Modern Java 25 circuit breaker library'
                    url = 'https://github.com/haisher/heimdall4j'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'haisher'
                            name = 'haisher'
                            url = 'https://github.com/haisher'
                        }
                    }

                    scm {
                        url = 'https://github.com/haisher/heimdall4j'
                        connection = 'scm:git:git://github.com/haisher/heimdall4j.git'
                        developerConnection = 'scm:git:ssh://github.com:haisher/heimdall4j.git'
                    }
                }
            }
        }
    }

    signing {
        def signingKey = project.findProperty("signing.key") ?: System.getenv("GPG_PRIVATE_KEY")
        def signingPassword = project.findProperty("signing.password") ?: System.getenv("GPG_PASSPHRASE")
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    }

    tasks.withType(Sign).configureEach {
        onlyIf {
            !version.toString().endsWith('-SNAPSHOT') &&
            (project.findProperty("signing.key") ?: System.getenv("GPG_PRIVATE_KEY")) != null
        }
    }
}

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = [
                        'heimdall4j-circuitbreaker/build/staging-deploy',
                        'heimdall4j-retry/build/staging-deploy',
                        'heimdall4j-ratelimiter/build/staging-deploy',
                        'heimdall4j-timeout/build/staging-deploy',
                        'heimdall4j-resilience/build/staging-deploy',
                        'heimdall4j-spring-boot/build/staging-deploy',
                        'heimdall4j-sidecar/build/staging-deploy'
                    ]
                }
            }
        }
    }
}
